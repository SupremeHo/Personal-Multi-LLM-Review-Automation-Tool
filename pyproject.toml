[project]
name = "Personal-Multi-LLM-Review-Automation-Tool"
version = "0.1.925"
description = "A multi-LLM platform that automates cross-validation of answers from multiple LLMs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic==0.122.0",
    "google-genai==2.18.1",
    "httpx==0.28.1",
    "openai==3.1.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "rich==15.0.0",
    "typer==0.27.1",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[project.urls]
Homepage = "https://github.com/SupremeHo/Personal-Multi-LLM-Review-Automation-Tool"
Repository = "https://github.com/SupremeHo/Personal-Multi-LLM-Review-Automation-Tool"
Issues = "https://github.com/SupremeHo/Personal-Multi-LLM-Review-Automation-Tool/issues"

[tool.pytest.ini_options]
# Only collect the pytest suite under tests/; the legacy test/ scripts make real
# API calls and are not part of the automated suite.
testpaths = ["tests"]
filterwarnings = ["error", 'ignore::DeprecationWarning:google\.genai\.types']

[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".venv*",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "TID", # flake8-tidy-imports
]

ignore = [
  "E501",   # line too long
  "B008",   # do not perform function calls in argument defaults
  "C901",   # too complex
  "TID252", # relative imports okay
]


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # imported but unused
"tests/**/*.py" = ["S101"] # use of assert

[tool.ruff.format]
preview = false
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

