[tool.ruff]
# 대상 Python 버전 - 설정하지 않으면 모든 파이썬 버전 대상으로 진행
target-version = "py312"

# 한 줄 최대 길이
line-length = 128

# 들여쓰기 너비
indent-width = 4

# 제외할 파일/디렉토리
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".venv_py312",
  ".venv_py313",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

extend-include = ["*.ipynb"]

[tool.ruff.lint]
# 활성화할 규칙들
select = [
  "E", # pycodestyle errors
  "W", # pycodestyle warnings
  "F", # Pyflakes
]

# 무시할 규칙들
ignore = [
  "E501", # line too long
  "B008", # do not perform function calls in argument defaults
]

# 파일별로 규칙 무시
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # imported but unused
"tests/**/*.py" = ["S101"] # use of assert

[tool.ruff.format]
# 문자열 따옴표 스타일
quote-style = "double"

# 들여쓰기 스타일
indent-style = "space"

# 후행 쉼표 처리
skip-magic-trailing-comma = false
