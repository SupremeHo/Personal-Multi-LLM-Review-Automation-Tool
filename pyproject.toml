[project]
name = "Personal Multi-LLM Review Automation Tool"
description = "A multi-LLM platform that automates cross-validation of answers from multiple LLMs."
readme = "README.md"

[project.urls]
Homepage = "https://github.com/SupremeHo/Personal-Multi-LLM-Review-Automation-Tool"
Repository = "https://github.com/SupremeHo/Personal-Multi-LLM-Review-Automation-Tool"
Issues = "https://github.com/SupremeHo/Personal-Multi-LLM-Review-Automation-Tool/issues"

[tool.ruff]
target-version = "py312"

line-length = 128

indent-width = 4

exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".hg",
  ".mypy_cache",
  ".nox",
  ".pants.d",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  ".venv_py312",
  ".venv_py313",
  "__pypackages__",
  "_build",
  "buck-out",
  "build",
  "dist",
  "node_modules",
  "venv",
]

extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # Pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
  "TID", # flake8-tidy-imports
]

ignore = [
  "E501",   # line too long
  "B008",   # do not perform function calls in argument defaults
  "C901",   # too complex
  "TID252", # relative imports okay
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]   # imported but unused
"tests/**/*.py" = ["S101"] # use of assert

[tool.ruff.format]
quote-style = "double"

indent-style = "space"

skip-magic-trailing-comma = false
