name: Claude Code Review

# Runs an automatic review whenever a PR is opened/updated,
# and also responds to "@claude" mentions in PR/issue comments.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Least-privilege token: read the code, write review comments.
permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  # 1) Automatic review on every PR open/update.
  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Automated Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review the diff of this pull request (the PR branch against its base
            branch). Focus on correctness bugs, security issues, and clear
            simplifications. Post concise, actionable inline comments only where
            they add value. Reply in Korean.

  # 2) On-demand analysis triggered by an "@claude" mention in a comment.
  mention-review:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && github.event.issue.pull_request) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Claude responds to @claude mention
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
