name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are cancelled instead of piling up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_py313_win.txt
      # Installs from the requirements file so the ruff version stays pinned in
      # one place and Dependabot keeps updating it.
      - run: pip install -r requirements_py313_win.txt
      - run: ruff check .

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python:
          - version: "3.12"
            requirements: requirements_py312_win.txt
          - version: "3.13"
            requirements: requirements_py313_win.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.version }}
          cache: pip
          cache-dependency-path: ${{ matrix.python.requirements }}
      - run: pip install -r ${{ matrix.python.requirements }}
      # No secrets needed: the suite uses fakes and in-memory SQLite, and API
      # keys are only read inside check_environment_variables().
      - run: pytest -q
