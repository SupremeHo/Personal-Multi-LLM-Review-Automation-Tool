name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded runs on the same branch are cancelled instead of piling up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: ruff check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The interpreter is not named here on purpose: uv reads `.python-version`
      # (3.14) and downloads that managed CPython itself, so the pinned version
      # lives in exactly one tracked file.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # `--locked` asserts uv.lock is still in sync with pyproject.toml and fails
      # the run otherwise, so a hand-edited dependency cannot slip through
      # unlocked. ruff is in the `dev` group, which uv syncs by default.
      - run: uv sync --locked
      - run: uv run ruff check .

  test:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      # No secrets needed: the suite uses fakes and in-memory SQLite, and API
      # keys are only read inside check_environment_variables().
      - run: uv run pytest -q
