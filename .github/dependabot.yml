# Dependabot version updates.
# Reference: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2

updates:
  # The uv ecosystem reads pyproject.toml + uv.lock in the repo root. Dependabot
  # bumps the `==` pin in pyproject.toml and re-locks in the same PR, so the two
  # never drift apart.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Groups are matched top to bottom; a dependency joins the first group it matches.
    groups:
      # LLM provider SDKs: the highest-risk surface, reviewed together in one PR.
      llm-sdks:
        patterns:
          - "anthropic"
          - "openai"
          - "google-genai"
          - "google-auth*"
          - "ollama"
      # Test and lint toolchain (the `dev` dependency group, plus the pytest
      # transitives that ride along with it in the lockfile).
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "pluggy"
          - "iniconfig"
      # Everything else, patch/minor only. Major bumps stay as individual PRs
      # so breaking changes get reviewed one at a time.
      python-deps:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"

  # Action versions used by .github/workflows/ci.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
